i26cs-blue)}#hi26cs .hi26cs-tag{margin: 8px 0 22px;padding: 0;font-size: 19px;color: var(--hi26cs-ink)}#hi26cs .hi26cs-card{background: #ffffff;border: 1px solid var(--hi26cs-line);border-top: 6px solid var(--hi26cs-green);border-radius: 18px;padding: 24px 20px 20px;margin: 0 0 20px;text-align: left}#hi26cs .hi26cs-card[hidden]{display: none}#hi26cs .hi26cs-cat{margin: 0 0 10px;padding: 0;font-size: 13px;font-weight: 700;letter-spacing: 0.06em;text-transform: uppercase;line-height: 1.4;color: var(--hi26cs-teal)}#hi26cs .hi26cs-q{margin: 0;padding: 0;font-size: clamp(23px,6vw,29px);line-height: 1.32;font-weight: 700;color: var(--hi26cs-ink)}#hi26cs .hi26cs-count{margin: 14px 0 0;padding: 0;font-size: 14px;color: var(--hi26cs-muted)}#hi26cs .hi26cs-card.hi26cs-show{animation: hi26cs-rise 0.38s ease-out}@keyframes hi26cs-rise{from{opacity: 0;transform: translateY(14px) scale(0.98)}to{opacity: 1;transform: none}}#hi26cs .hi26cs-go{-webkit-appearance: none;appearance: none;display: block;width: 100%;min-height: 60px;margin: 0;padding: 14px 20px;font-size: 20px;font-weight: 700;line-height: 1.2;text-transform: none;color: #ffffff !important;background: var(--hi26cs-blue) !important;border: 0 !important;border-radius: 999px !important;cursor: pointer;box-shadow: 0 3px 0 #0f3552 !important;transition: transform 0.08s ease,background 0.15s ease;touch-action: manipulation}#hi26cs .hi26cs-go:hover{background: var(--hi26cs-blue-dk) !important;color: #ffffff !important}#hi26cs .hi26cs-go:active{transform: translateY(2px);box-shadow: 0 1px 0 #0f3552 !important}#hi26cs :focus-visible{outline: 3px solid var(--hi26cs-focus);outline-offset: 3px}#hi26cs .hi26cs-note{margin: 10px 0 0;padding: 0;font-size: 15px;font-weight: 600;color: var(--hi26cs-teal)}#hi26cs .hi26cs-note:empty{margin: 0}#hi26cs .hi26cs-modes{border: 0;margin: 24px 0 0;padding: 0;min-width: 0}#hi26cs .hi26cs-modes legend{display: block;width: 100%;padding: 0;margin: 0 0 12px;border: 0;font-size: clamp(22px,6.4vw,32px);font-weight: 700;line-height: 1.15;text-transform: uppercase;color: var(--hi26cs-teal);text-align: center}#hi26cs .hi26cs-opt{display: block;margin-top: 4px;font-size: 15px;font-weight: 400;text-transform: none;color: var(--hi26cs-muted)}#hi26cs .hi26cs-chips{display: grid;grid-template-columns: 1fr 1fr;gap: 10px}#hi26cs .hi26cs-chip{position: relative;display: block;margin: 0;padding: 0;font-weight: normal;cursor: pointer}#hi26cs .hi26cs-chip input{position: absolute;opacity: 0;top: 0;left: 0;width: 100%;height: 100%;margin: 0;cursor: pointer}#hi26cs .hi26cs-chip > span{display: flex;align-items: center;justify-content: center;gap: 6px;min-height: 52px;padding: 8px 10px;border-radius: 14px;border: 2px solid var(--hi26cs-chip-line) !important;background: #ffffff !important;font-size: 17px;font-weight: 600;line-height: 1.2;color: var(--hi26cs-ink)}#hi26cs .hi26cs-chip input:checked + span{border-color: var(--hi26cs-teal) !important;background: var(--hi26cs-teal) !important;color: #ffffff !important}#hi26cs .hi26cs-chip input:focus-visible + span{outline: 3px solid var(--hi26cs-focus);outline-offset: 2px}#hi26cs .hi26cs-howto{margin: 24px 0 0;padding: 0;font-size: 19px;color: var(--hi26cs-ink)}#hi26cs .hi26cs-foot{margin: 0;padding: 14px 16px 16px;background: var(--hi26cs-soft);border-top: 1px solid var(--hi26cs-line);font-size: 13px;color: var(--hi26cs-muted)}@media (max-width: 360px){#hi26cs .hi26cs-chips{grid-template-columns: 1fr}}@media (prefers-reduced-motion: reduce){#hi26cs .hi26cs-card.hi26cs-show{animation: none}#hi26cs .hi26cs-go{transition: none}}";

  var ROOT_ID = "hi26cs";
  var STORE_KEY = "hi26cs-progress-v1";

  var E = { /* emoji, written as codes so no editor can scramble them */
    talk: "\uD83D\uDCAC", sparkle: "\u2728", again: "\uD83D\uDD04",
    dice: "\uD83C\uDFB2", sprout: "\uD83C\uDF31", heart: "\u2764\uFE0F"
  };

  function markup() {
    var chip = function (value, icon, label, checked) {
      return '<label class="hi26cs-chip"><input type="radio" name="hi26cs-mode" value="' + value + '"' + (checked ? " checked" : "") +
             '><span><span aria-hidden="true">' + icon + '</span> ' + label + '</span></label>';
    };
    return '' +
      '<div class="hi26cs-band">' +
        '<img class="hi26cs-logo" src="' + LOGO + '" alt="Head Start California Health Institute 2026, November 4 to 6, Hilton Costa Mesa" width="455" height="200">' +
        '<p class="hi26cs-theme"><span class="hi26cs-theme-a">HEALTH</span> <span class="hi26cs-theme-b">in every</span> <span class="hi26cs-theme-c">Connection</span></p>' +
      '</div>' +
      '<div class="hi26cs-body">' +
        '<h2 class="hi26cs-title"><span aria-hidden="true">' + E.talk + '</span> Let\u2019s Connect!</h2>' +
        '<p class="hi26cs-tag">Great conversations start with a great question.</p>' +
        '<section class="hi26cs-card" hidden aria-label="Your conversation starter">' +
          '<p class="hi26cs-cat"></p><p class="hi26cs-q"></p>' +
        '</section>' +
        '<button type="button" class="hi26cs-go"><span aria-hidden="true">' + E.sparkle + ' </span>Give Me a Question!</button>' +
        '<p class="hi26cs-note" aria-live="polite"></p>' +
        '<fieldset class="hi26cs-modes"><legend>Pick a topic <span class="hi26cs-opt">(optional)</span></legend><div class="hi26cs-chips">' +
          chip("all", E.dice, "Surprise Me!", true) +
          chip("Light", E.talk, "Keep It Light", false) +
          chip("Shop", E.sprout, "Let\u2019s Talk Shop", false) +
          chip("Deeper", E.heart, "Go a Little Deeper", false) +
        '</div></fieldset>' +
        '<p class="hi26cs-howto">Share your answer with someone at your table, learn something new, and keep the conversation going!</p>' +
        '<div class="hi26cs-sr" aria-live="polite"></div>' +
      '</div>' +
      '<p class="hi26cs-foot">No sign-in, no tracking. Questions developed by Head Start California with AI assistance.</p>';
  }

  function setup(root) {
    if (root.getAttribute("data-hi26cs-ready") === "1") return;
    root.setAttribute("data-hi26cs-ready", "1");
    if (!document.getElementById("hi26cs-style")) {
      var st = document.createElement("style");
      st.id = "hi26cs-style";
      st.appendChild(document.createTextNode(CSS));
      (document.head || document.documentElement).appendChild(st);
    }
    root.innerHTML = markup();

    var $ = function (c) { return root.querySelector("." + c); };
    var card = $("hi26cs-card"), catEl = $("hi26cs-cat"), qEl = $("hi26cs-q"),
        goBtn = $("hi26cs-go"), note = $("hi26cs-note"), live = $("hi26cs-sr");
    var radios = root.querySelectorAll('input[name="hi26cs-mode"]');

    var library = [], builtFrom = -1;
    function refresh() {                       /* (re)build the list when another section adds questions */
      if (Q.length === builtFrom) return;
      builtFrom = Q.length; library = [];
      var seenText = {};
      Q.forEach(function (g) {
        (g && g.q || []).forEach(function (text) {
          if (text && !seenText[text]) { seenText[text] = 1; library.push({ c: g.c, t: g.t, q: text }); }
        });
      });
    }

    var seen = {}, lastShown = "", mode = "all";
    try {
      var s = JSON.parse(window.localStorage.getItem(STORE_KEY) || "{}");
      (s.seen || []).forEach(function (t) { seen[t] = true; });
      if (s.mode) mode = s.mode;
    } catch (e) {}
    function save() {
      try { window.localStorage.setItem(STORE_KEY, JSON.stringify({ seen: Object.keys(seen), mode: mode })); } catch (e) {}
    }
    function syncRadios() { for (var k = 0; k < radios.length; k++) radios[k].checked = (radios[k].value === mode); }
    function pool() { refresh(); return mode === "all" ? library : library.filter(function (x) { return x.t === mode; }); }
    function randomIndex(n) {
      try { var a = new Uint32Array(1); window.crypto.getRandomValues(a); return a[0] % n; }
      catch (e) { return Math.floor(Math.random() * n); }
    }

    function next() {
      var p = pool();
      if (!p.length) { mode = "all"; syncRadios(); p = pool(); }
      if (!p.length) return;
      var fresh = p.filter(function (x) { return !seen[x.q]; });
      var restarted = false;
      if (!fresh.length) {                       /* all seen: start a fresh round */
        p.forEach(function (x) { delete seen[x.q]; });
        fresh = p.filter(function (x) { return x.q !== lastShown; });
        if (!fresh.length) fresh = p;
        restarted = true;
      }
      var pick = fresh[randomIndex(fresh.length)];
      seen[pick.q] = true; lastShown = pick.q; save();
      var done = p.filter(function (x) { return seen[x.q]; }).length;

      catEl.textContent = pick.c || "";
      qEl.textContent = pick.q.replace(/'/g, "\u2019");  /* curly apostrophes on screen */
      note.textContent = restarted ? "You\u2019ve seen every question in this set, so here\u2019s a fresh round!" : "";
      card.hidden = false;
      card.classList.remove("hi26cs-show"); void card.offsetWidth; card.classList.add("hi26cs-show");
      goBtn.innerHTML = '<span aria-hidden="true">' + E.again + ' </span>Another Question';
      live.textContent = "";
      setTimeout(function () { live.textContent = (pick.c ? pick.c + ". " : "") + qEl.textContent; }, 60);
    }

    syncRadios();
    goBtn.addEventListener("click", next);
    for (var k = 0; k < radios.length; k++) {
      radios[k].addEventListener("change", function (ev) {
        mode = ev.target.value; save();
        if (!card.hidden) next();
      });
    }
  }

  function scan() {
    var root = document.getElementById(ROOT_ID);
    if (root) setup(root);
  }

  /* Run now, when the page finishes loading, and whenever PheedLoop swaps page content in */
  scan();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan);
  window.addEventListener("load", scan);
  if (window.MutationObserver) {
    var pending = false;
    new MutationObserver(function () {
      if (pending) return;
      pending = true;
      setTimeout(function () { pending = false; scan(); }, 150);
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
